# hyprpaper — https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
#
# Note: this is hyprlang (.conf), not lua. Only the compositor itself moved to
# lua in 0.55 — the ecosystem tools still use hyprlang.
#
# hyprpaper 0.8+ uses `wallpaper { }` blocks. The old `preload = ` /
# `wallpaper = mon,path` syntax you'll see in older examples is gone.

splash = false
ipc    = true

# An empty `monitor` makes this the fallback for every output, so this keeps
# working if you plug in a second screen.
wallpaper {
    monitor  =
    path     = /usr/share/hypr/wall0.png
    fit_mode = cover
}

# Swap at runtime without restarting:
#   hyprctl hyprpaper wallpaper ',/path/to/image.png,cover'
