# hyprlock — https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# hyprlang (.conf), not lua — see the note in hyprpaper.conf.
# Styling follows your Rose Pine Moon / ghostty palette, and keeps the shape of
# your previous hyprlock: animations off, square corners, wide centered field.

# Rose Pine Moon
$base   = rgba(161521ff)
$surface = rgba(2a273fcc)
$muted  = rgba(6e6a86ff)
$subtle = rgba(908caaff)
$text   = rgba(e0def4ff)
$iris   = rgba(c4a7e7ff)
$foam   = rgba(9ccfd8ff)
$love   = rgba(eb6f92ff)

# Labels here are text-only (time/date/user), so no icon fallback needed.
$font = Iosevka Term

general {
    hide_cursor        = true
    ignore_empty_input = true
}

# Matches animations:enabled = false in your looknfeel.lua
animations {
    enabled = false
}

background {
    monitor     =
    path        = /usr/share/hypr/wall0.png
    color       = $base

    blur_passes = 3
    blur_size   = 8
    brightness  = 0.6
    vibrancy    = 0.1696
}

input-field {
    monitor  =
    size     = 650, 100
    position = 0, 0
    halign   = center
    valign   = center

    outline_thickness = 3
    rounding          = 0

    inner_color = $surface
    outer_color = $iris
    check_color = $foam
    fail_color  = $love
    font_color  = $text

    font_family      = $font
    placeholder_text = <i>Enter Password</i>
    fail_text        = <i>$FAIL ($ATTEMPTS)</i>

    dots_spacing  = 0.3
    fade_on_empty = false
    shadow_passes = 0
}

# TIME
label {
    monitor     =
    text        = $TIME
    font_size   = 90
    font_family = $font
    color       = $text

    position = 0, 210
    halign   = center
    valign   = center
}

# DATE
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %d %B %Y"
    font_size   = 22
    font_family = $font
    color       = $subtle

    position = 0, 130
    halign   = center
    valign   = center
}

# USER
label {
    monitor     =
    text        = $USER
    font_size   = 16
    font_family = $font
    color       = $muted

    position = 0, -90
    halign   = center
    valign   = center
}
