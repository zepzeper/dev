# Which portal backend answers under i3.
#
# The Settings portal is what tells Firefox, Chromium, Electron apps, GTK4 and
# nvim's auto-dark-mode whether the desktop is dark, and only the gtk backend
# reads that out of dconf. This machine also has xdg-desktop-portal-gnome and
# -hyprland installed, neither of which claims i3 in its .portal file, so
# without this xdg-desktop-portal picks whichever it finds first - and dark mode
# comes out inconsistent between apps for no visible reason.
#
# Named i3-portals.conf, not portals.conf: the per-desktop file only applies
# when XDG_CURRENT_DESKTOP is i3, which leaves the Hyprland session on its own
# backend for screencast and screenshot.
[preferred]
default=gtk

# ... except screenshots, which the gtk backend answers by calling
# org.gnome.Shell.Screenshot - a service that does not exist outside GNOME. It
# never replies, so anything asking the portal for a screenshot under i3 hangs
# for the full 30-second timeout and then fails. "none" turns that into an
# immediate, honest "no implementation", which is what a caller can actually
# act on. Nothing is lost: no portal backend can screenshot an X11 session,
# which is why flameshot is configured to bypass the portal (see runs/i3).
org.freedesktop.impl.portal.Screenshot=none
