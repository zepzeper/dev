# Qt6 has no notion of the freedesktop color-scheme, so it needs telling
# separately: QT_QPA_PLATFORMTHEME=qt6ct (set in .config/personal/env) points Qt
# here, and this picks the style that draws dark.
#
# style=kvantum rather than a custom qt6ct palette: Fedora's kvantum package is
# the Qt6 plugin (/usr/lib64/qt6/plugins/styles/libkvantum.so), it themes the
# widgets and not just their colours, and env-hypr's QT_STYLE_OVERRIDE=kvantum
# already selects it - so both sessions end up on the same style instead of two
# different dark Qt looks. The theme itself is in .config/Kvantum.
[Appearance]
style=kvantum
icon_theme=Adwaita
custom_palette=false
