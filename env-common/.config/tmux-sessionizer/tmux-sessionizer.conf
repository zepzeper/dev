# Overrides the defaults (~/ ~/personal ~/personal/dev/env/.config) entirely.
# Use TS_SEARCH_PATHS, not TS_EXTRA_SEARCH_PATHS - the latter only appends to
# the defaults, which is what pulled all of ~/ into the picker.
TS_SEARCH_PATHS=(/data:1 ~/personal:1)
TS_LOG=file

# Commands `tmux-sessionizer -s <index>` can run, opened in a new window in the
# current session. Alt+h in .zsh_profile is bound to index 0.
#
# Quote entries containing spaces - the array is indexed per element, so an
# unquoted ("nvim" ".") would be two commands rather than one.
TS_SESSION_COMMANDS=("nvim .")
