# ============================================
# BASIC SETTINGS
# ============================================
set -g default-shell /usr/bin/zsh
set -sg escape-time 10
set -g base-index 1
set -g pane-base-index 1
set -g mode-keys vi
set -g allow-passthrough on

set-option -sg escape-time 10
set -s extended-keys always


# Enable true color support
set -g default-terminal "tmux-256color"
# Declare truecolour for whatever terminal is actually in use. This used to
# name xterm-256color only, but ghostty reports TERM=xterm-ghostty, so the RGB
# feature never applied there - tmux info showed "RGB: [missing]" and every
# #rrggbb in the status bar below was silently degraded.
set -as terminal-features "*:RGB"

# ============================================
# KEY BINDINGS
# ============================================
set -g prefix C-a
unbind C-b
bind C-a send-prefix

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; run-shell "notify-send 'Tmux' 'Config reloaded!'"

bind -r o new-window -c '#{pane_current_path}'

bind e copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
set -g set-clipboard on

bind f new-window "$HOME/.local/bin/tmux-sessionizer"
bind i popup -E "$HOME/.local/scripts/misc/cheat"
bind m new-window "bash -ic 'compgen -c | fzf | xargs man'"

# Oxocarbon colors 
# MUTED="#525252"
# SUBTLE="#dde1e6"
# TEXT="#f2f4f8"
# IRIS="#ff7eb6"
# SURFACE="#262626"
# BASE="#161616"

# Status bar - transparent background
set -g status-style bg=default,fg=#dde1e6
set -g status-position top
set -g status-interval 1
set -g status-justify left

# Pane borders
set -g pane-border-style fg=#525252
set -g pane-active-border-style fg=#dde1e6

# Status left - session name and windows together on the left
set -g status-left-length 200
set -g status-left "#[fg=#f2f4f8]#S  #[fg=#525252]│ "

# Window status - only numbers
set -g window-status-separator ""
set -g window-status-format "#[fg=#525252]#I  "
set -g window-status-current-format "#[fg=#f2f4f8]#I  "

# Status right - time on the right
set -g status-right-length 100
set -g status-right "#[fg=#dde1e6]%I:%M %p "

# Message styling
set -g message-style bg=#ff7eb6,fg=#161616
set -g message-command-style bg=#262626,fg=#f2f4f8

# Copy mode styling
set -g mode-style bg=#262626,fg=#f2f4f8
