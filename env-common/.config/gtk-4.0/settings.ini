# GTK4 reads settings.ini too. libadwaita apps follow the portal's color-scheme
# and ignore the theme name entirely, but plain GTK4 apps - and any of them
# started before the portal is up - land here instead.
[Settings]
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24
