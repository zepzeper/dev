# GTK3's dark preference, for the apps that do not ask the portal.
#
# Under GNOME, gnome-settings-daemon pushes org.gnome.desktop.interface into
# XSettings and every GTK app picks it up from there. A bare i3 session runs no
# such daemon, so GTK3 falls back to this file - which is why dark mode silently
# stopped applying to GTK3 apps outside the GNOME session. The dconf key is set
# as well (runs/theme): that is the one the portal reports, and it is what GTK4,
# Electron and Firefox actually read.
#
# Dark Adwaita is the prefer-dark flag rather than a theme called Adwaita-dark:
# GTK3 builds Adwaita in, and the separate dark variant only ships in
# gnome-themes-extra, which is not installed on either machine.
[Settings]
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24
